name: Verify production build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run check:production
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, iconv
          coverage: none
      - run: npm run test:cpanel
      - name: Verify cPanel static export
        run: npm run build:cpanel -- /tmp/apar-cpanel-build
      - name: Verify cPanel pages and PHP rejection paths
        run: node scripts/check-cpanel.mjs /tmp/apar-cpanel-build
      - name: Check production routes and assets
        run: |
          npm start -- --hostname 127.0.0.1 --port 3021 > /tmp/apar-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3021/ > /dev/null; then break; fi
            sleep 1
          done
          npm run check:http -- http://127.0.0.1:3021 --report /tmp/apar-http.json
